version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    image: hoorawan/chic-backend:latest
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb/chic
      - PORT=5000
    depends_on:
      - mongodb
    env_file:
      - ./backend/.env

  frontend:
    image: hoorawan/chic-frontend:latest
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api/v1
      - API_BASE_URL=http://backend:5000/api/v1
    depends_on:
      - backend

volumes:
  mongo-data:
